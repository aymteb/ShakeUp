<div class="relative flex min-h-dvh items-center justify-center px-6 py-12">
  <div class="su-panel relative w-full max-w-md px-6 py-8 sm:px-8">
    <p class="text-sm font-medium text-ink-mute">ShakeUp</p>
    <h1 class="mt-2 font-display text-3xl font-bold tracking-tight text-ink">Connexion</h1>
    <p class="mt-2 text-sm text-ink-mute">Back-office coach</p>

    @if (demoMode()) {
      <p class="mt-5 rounded-2xl bg-ash/80 px-4 py-3 text-sm text-ink" role="status">
        Compte démo prérempli — cliquez sur <strong>Entrer</strong>.
      </p>
    }

    <form class="mt-8 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block space-y-1.5">
        <span class="text-sm font-medium text-ink">Email</span>
        <input type="email" formControlName="email" autocomplete="username" class="su-field" />
      </label>
      <label class="block space-y-1.5">
        <span class="text-sm font-medium text-ink">Mot de passe</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="su-field"
        />
      </label>

      @if (error()) {
        <p class="text-sm text-red-700" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="su-btn-primary w-full py-3">Entrer</button>
    </form>

    <p class="mt-6 text-sm text-ink-mute">
      Élève ?
      <a [href]="frontUrl" class="font-medium text-ink underline-offset-2 hover:underline">App publique</a>
    </p>
  </div>
</div>
