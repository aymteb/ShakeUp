<div class="relative flex min-h-dvh items-center justify-center bg-paper px-6 py-12">
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(184,240,0,0.12),transparent_55%)]"
    aria-hidden="true"
  ></div>

  <div class="relative w-full max-w-md">
    <a
      routerLink="/"
      class="mb-10 inline-block font-display text-2xl font-extrabold tracking-tight text-ink transition hover:text-ink-mute"
    >
      ShakeUp
    </a>

    <h1 class="font-display text-3xl font-bold tracking-tight text-ink sm:text-4xl">Connexion</h1>
    <p class="mt-2 text-ink-mute">Espace élève — programmes et nutrition au quotidien.</p>

    <form class="mt-10 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block space-y-1.5">
        <span class="text-sm font-medium text-ink">Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full border border-ash-line bg-paper-raised px-3.5 py-3 text-ink shadow-sm transition placeholder:text-ink-mute/50 focus:border-ink focus:outline-none"
          placeholder="vous@exemple.com"
        />
      </label>
      <label class="block space-y-1.5">
        <span class="text-sm font-medium text-ink">Mot de passe</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full border border-ash-line bg-paper-raised px-3.5 py-3 text-ink shadow-sm transition placeholder:text-ink-mute/50 focus:border-ink focus:outline-none"
        />
      </label>

      @if (error()) {
        <p class="text-sm text-red-700" role="alert">{{ error() }}</p>
      }

      <button
        type="submit"
        class="w-full bg-ink px-4 py-3.5 font-display text-sm font-bold tracking-wide text-paper transition hover:bg-ink-soft"
      >
        Entrer
      </button>
    </form>

    <p class="mt-8 text-sm text-ink-mute">
      Vous êtes coach ?
      <a [href]="backofficeUrl + '/login'" class="font-medium text-ink underline-offset-2 hover:underline"
        >Back-office</a
      >
    </p>
  </div>
</div>
