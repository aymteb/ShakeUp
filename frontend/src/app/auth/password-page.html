<div class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-ink px-6 py-12 text-paper">
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div
      class="absolute -left-[25%] top-[-15%] h-[60vmax] w-[60vmax] rounded-full bg-[radial-gradient(circle_at_center,rgba(184,240,0,0.16),transparent_62%)]"
    ></div>
    <div
      class="absolute inset-0 opacity-[0.07] [background-image:linear-gradient(rgba(242,245,243,0.35)_1px,transparent_1px),linear-gradient(90deg,rgba(242,245,243,0.35)_1px,transparent_1px)] [background-size:48px_48px]"
    ></div>
  </div>

  <div class="relative w-full max-w-md">
    <p class="mb-10 font-display text-2xl font-extrabold tracking-tight text-volt">ShakeUp</p>

    <div class="border border-white/12 bg-ink-soft/85 px-6 py-8 shadow-lift backdrop-blur-sm sm:px-8">
      <h1 class="font-display text-3xl font-bold tracking-tight text-paper">Nouveau mot de passe</h1>
      <p class="mt-2 text-sm text-paper/60">
        Choisis un mot de passe personnel avant d’entrer.
      </p>

      <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block space-y-1.5">
          <span class="text-sm font-medium text-paper/80">Mot de passe actuel</span>
          <input
            type="password"
            formControlName="currentPassword"
            class="login-field w-full rounded-md border border-white/15 bg-ink/70 px-3.5 py-3 text-paper shadow-sm transition focus:border-volt focus:outline-none focus:ring-1 focus:ring-volt/40"
          />
        </label>
        <label class="block space-y-1.5">
          <span class="text-sm font-medium text-paper/80">Nouveau mot de passe</span>
          <input
            type="password"
            formControlName="newPassword"
            class="login-field w-full rounded-md border border-white/15 bg-ink/70 px-3.5 py-3 text-paper shadow-sm transition focus:border-volt focus:outline-none focus:ring-1 focus:ring-volt/40"
          />
        </label>

        @if (error()) {
          <p class="text-sm text-red-300" role="alert">{{ error() }}</p>
        }

        <button
          type="submit"
          class="w-full rounded-md bg-volt px-4 py-3.5 font-display text-sm font-bold tracking-wide text-ink transition hover:bg-white"
        >
          Enregistrer
        </button>
      </form>
    </div>
  </div>
</div>
