<div class="relative flex min-h-dvh items-center justify-center bg-paper px-6 py-12">
  <div class="relative w-full max-w-md">
    <p class="mb-10 font-display text-2xl font-extrabold tracking-tight text-ink">ShakeUp</p>
    <h1 class="font-display text-3xl font-bold tracking-tight">Nouveau mot de passe</h1>
    <p class="mt-2 text-ink-mute">Choisis un mot de passe personnel avant d’entrer.</p>

    <form class="mt-10 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block space-y-1.5">
        <span class="text-sm font-medium">Mot de passe actuel</span>
        <input
          type="password"
          formControlName="currentPassword"
          class="w-full border border-ash-line bg-paper-raised px-3.5 py-3 shadow-sm focus:border-ink focus:outline-none"
        />
      </label>
      <label class="block space-y-1.5">
        <span class="text-sm font-medium">Nouveau mot de passe</span>
        <input
          type="password"
          formControlName="newPassword"
          class="w-full border border-ash-line bg-paper-raised px-3.5 py-3 shadow-sm focus:border-ink focus:outline-none"
        />
      </label>

      @if (error()) {
        <p class="text-sm text-red-700" role="alert">{{ error() }}</p>
      }

      <button
        type="submit"
        class="w-full bg-ink px-4 py-3.5 font-display text-sm font-bold tracking-wide text-paper transition hover:bg-ink-soft"
      >
        Enregistrer
      </button>
    </form>
  </div>
</div>
